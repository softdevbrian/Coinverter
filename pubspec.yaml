name: currency_converter
description: "Coinverter — A beautiful, offline-resilient currency converter."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# Version bumped to 2.0.0 for the major overhaul
version: 2.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  # iOS-style icons
  cupertino_icons: ^1.0.8

  # Local persistence — saves user preferences and cached exchange rates
  shared_preferences: ^2.3.4

  # HTTP client for fetching live exchange rates
  http: ^1.2.2

  # Network connectivity monitoring for offline detection
  connectivity_plus: ^6.1.3

  # Number formatting and date formatting
  intl: ^0.19.0

  # Sparkline chart for rate trends
  fl_chart: ^0.70.2

  # Modern typography
  google_fonts: ^6.2.1

  # Loading skeleton animations
  shimmer: ^3.0.0

  # Lightweight state management
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icons/coin_icon.png"
  adaptive_icon_background: "#ffea70"
  adaptive_icon_foreground: "assets/icons/coin_foreground.png"